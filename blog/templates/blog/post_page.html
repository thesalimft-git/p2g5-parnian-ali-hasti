{% extends 'base.html' %}


{% block content %}
    <h1>
        Posts
    </h1>
    <div class="container">
        {% for post in posts %}
            <h3>
                {{post.title|title}}
            </h3>
            <p>
                {{post.content|title}}
            </p>
        {% endfor %}
    </div>


    <div>
        <form action="" method='POST'>
            {% csrf_token %}
            <div>
                <label for="">title</label>
                <input type="text" name='title'>
            </div>
            <div>
                <label for="">content</label>
                <input type="text" name='content'>
            </div>
            <button type="submit">submit</button>
        </form>
    </div>




{% endblock content %}
